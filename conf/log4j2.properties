# Log do Spark enxuto: só WARN+ do próprio Spark; nossos jobs logam em JSON no stdout
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex
logger.spark_ui.name = org.apache.spark.ui.SparkUI
logger.spark_ui.level = info
logger.parquet.name = org.apache.parquet
logger.parquet.level = error
# Janelas globais em tabelas Gold pequenas (27 UFs, 12 meses) são intencionais
logger.window.name = org.apache.spark.sql.execution.window.WindowExec
logger.window.level = error
logger.gc.name = org.apache.spark.metrics.GarbageCollectionMetrics
logger.gc.level = error
logger.nativeloader.name = org.apache.hadoop.util.NativeCodeLoader
logger.nativeloader.level = error
