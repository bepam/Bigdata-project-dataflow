# =============================================================================
# Projeto Final — Pipeline ShopBrasil (DataFlow Analytics)
# Big Data Processing · MBA Engenharia de Dados · Mackenzie
# =============================================================================
# Um comando sobe tudo:     docker compose up -d --build
# Airflow UI:               http://localhost:8080   (admin / admin)
# Spark UI (durante jobs):  http://localhost:4040
#
# A DAG `shopbrasil_pipeline_vendas` já nasce despausada e dispara sozinha
# na primeira subida (schedule diário, catchup desligado).
#
# Serviços: postgres (metadados) · airflow-init (migra DB, cria admin, ajusta
# permissões) · airflow-webserver · airflow-scheduler (LocalExecutor; é aqui
# que o spark-submit roda, em modo local[2]).
# =============================================================================

x-airflow-common: &airflow-common
  build: .
  image: shopbrasil-airflow-spark:1.0
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"   # sem clique manual para despausar
    AIRFLOW__CORE__DEFAULT_TIMEZONE: "America/Sao_Paulo"
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__WEBSERVER__SECRET_KEY: "shopbrasil-projeto-final"  # igual em todos (leitura de logs)
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: "America/Sao_Paulo"
    AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: "true"   # UI atrás do proxy do GitHub Codespaces
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "10"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
    # Conexão Spark usada pelo SparkSubmitOperator (modo local, 2 cores)
    AIRFLOW_CONN_SPARK_LOCAL: '{"conn_type": "spark", "host": "local[2]"}'
  volumes:
    - ./dags:/opt/airflow/dags
    - ./spark_jobs:/opt/airflow/spark_jobs
    - ./quality:/opt/airflow/quality
    - ./scripts:/opt/airflow/scripts
    - ./conf:/opt/airflow/conf
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy

services:
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Roda uma vez: cria pastas do lake com dono correto, migra o banco e cria
  # o usuário admin. Os demais serviços só sobem depois que ele termina.
  airflow-init:
    <<: *airflow-common
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs \
                 /opt/airflow/data/bronze /opt/airflow/data/silver /opt/airflow/data/gold \
                 /opt/airflow/data/quarentena /opt/airflow/data/quality /opt/airflow/data/notificacoes
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs \
                 /opt/airflow/data/bronze /opt/airflow/data/silver /opt/airflow/data/gold \
                 /opt/airflow/data/quarentena /opt/airflow/data/quality /opt/airflow/data/notificacoes
        exec /entrypoint airflow version
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin

  # ---------------------------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    ports:
      - "4040:4040"   # Spark UI do job em execução
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db:
